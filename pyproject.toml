[project]
name = "relp"
version = "0.1.0"
description = "RELP Defect Detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "detectron2",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "sam-2>=1.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[tool.uv]
package = false
override-dependencies = [
    "iopath>=0.1.10",
]

[tool.uv.extra-build-dependencies]
detectron2 = ["torch==2.14.0", "numpy", "setuptools<81", "ninja"]
sam-2 = ["torch==2.14.0", "numpy"]

[tool.uv.sources]
detectron2 = [
    { path = "../detectron_all", editable = true, marker = "sys_platform == 'win32'" },
    { git = "https://github.com/facebookresearch/detectron2.git", rev = "02b5c4e295e990042a714712c21dc79b731e8833", marker = "sys_platform != 'win32'" },
]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
torch = { index = "pytorch-cuda", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cuda", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
